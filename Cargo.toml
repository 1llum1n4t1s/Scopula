[package]
name = "scopula"
version = "0.1.0"
edition = "2024"
description = "Rust の target フォルダーに溜まる古い成果物を定期的に掃除する CLI"
license = "MIT"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.2"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_Console", "Win32_Security"] }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
